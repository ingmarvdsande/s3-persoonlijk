repos:
  # - repo: ...

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v2.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, build, chore, ci, docs, style, refactor, perf, test] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]
